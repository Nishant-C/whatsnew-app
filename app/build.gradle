            signingConfig signingConfigs.permanent
        }
        release {
            signingConfig signingConfigs.permanent
            minifyEnabled = false
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }
    buildFeatures {
